name: Build CineVerse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee /tmp/build.log

      - name: Report build errors
        if: failure()
        run: |
          awk '/FAILURE: Build failed/{f=1} f' /tmp/build.log | head -14 | sed 's/^/::error::/' || true
          tail -8 /tmp/build.log | sed 's/^/::notice::/' || true

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: CineVerse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
